name: flutter_training
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.2.6 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  provider: ^6.1.2
  google_fonts: ^6.1.0
  http: ^1.2.1
  worker_manager: ^7.0.2
  workmanager: ^0.5.2
  json_annotation: ^4.9.0
  flutter_localization: ^0.2.0
  rxdart: ^0.28.0
  flutter_localizations:
    sdk: flutter
  rive: ^0.13.8
  faker: ^2.1.0
  scrollable_positioned_list: ^0.3.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  json_serializable: ^6.8.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/
    - assets/animations/
